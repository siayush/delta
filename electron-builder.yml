appId: com.delta.desktop
productName: Delta
compression: maximum
afterPack: build/afterPack.js
directories:
  buildResources: build
electronLanguages:
  - en
files:
  - out/**
  - resources/**
  - package.json
  - '!**/*.map'
  - '!**/*.ts'
  - '!**/*.tsx'
  - '!**/test{,s}/**'
  - '!**/__tests__/**'
  - '!**/docs/**'
  - '!**/example{,s}/**'
  - '!**/*.md'
  - '!generate-json.js'
  - '!plans/**'
  - '!**/node_modules/better-sqlite3/deps/**'
  - '!**/node_modules/better-sqlite3/src/**'
asarUnpack:
  - '**/*.node'
win:
  executableName: Delta
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  category: public.app-category.developer-tools
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: Delta needs access to the Documents folder to import/export collections.
    - NSDownloadsFolderUsageDescription: Delta needs access to the Downloads folder to import/export collections.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - deb
  maintainer: delta.app
  category: Development
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: siayush
  repo: delta
